baseURL = "https://fwqabc.com/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "fwqabc 出海ABC"
theme = "PaperMod"
enableRobotsTXT = true
pagination.pagerSize = 10

[taxonomies]
  tag = "tags"
  merchant = "merchants"
  route = "routes"
  datacenter = "datacenters"

[permalinks]
  [permalinks.page]
    deals = "/deals/:contentbasename/"
    review = "/review/:contentbasename/"
    guides = "/guides/:contentbasename/"
    tutorials = "/tutorials/:contentbasename/"
    tools = "/tools/:contentbasename/"

[params]
  env = "production"
  homeTitle = "出海服务器，少踩坑少花钱"
  description = "出海ABC旗下服务器指南：国外VPS真实价格、线路实测与优惠汇总，帮站长、外贸和出海新手少踩坑少花钱。价格以官网为准。"
  tagline = "真实价格、线路实测、优惠汇总，选对一台不纠结"
  keywords = ["国外VPS", "VPS优惠", "外贸建站服务器", "出海服务器", "CN2 GIA", "双11 VPS"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowToc = true
  ShowPostNavLinks = true
  telegram = ""      # Telegram 频道链接，如 https://t.me/fwqabc；留空则不显示订阅框
  umami = ""          # Umami 统计脚本地址，如 https://analytics.example.com/script.js；留空=不启用
  umamiWebsiteId = ""
  double11 = "2026-11-11T00:00:00+08:00"
  blackFridayStart = "2026-11-25T00:00:00+08:00"
  blackFridayEnd = "2026-11-30T23:59:59+08:00"

  [params.label]
    text = "出海ABC · 服务器"
    iconSVG = '<svg class="wm" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f766e"/><text x="16" y="21.5" font-size="14" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">ABC</text></svg>'
  [params.assets]
    favicon = "/favicon.svg"
  [params.footer]
    text = "出海ABC · 服务器 —— 出海服务器，少踩坑少花钱。本站含推广链接，通过链接购买我们可能获得佣金，不影响你的价格，详见 [推广披露](/disclosure/)。价格以官网为准。"

[menus]
  [[menus.main]]
    name = "优惠促销"
    url = "/deals/"
    weight = 10
  [[menus.main]]
    name = "实测评测"
    url = "/review/"
    weight = 20
  [[menus.main]]
    name = "线路专题"
    url = "/routes/"
    weight = 30
  [[menus.main]]
    name = "按用途选"
    url = "/guides/"
    weight = 40
  [[menus.main]]
    name = "商家目录"
    url = "/merchants/"
    weight = 50
  [[menus.main]]
    name = "工具"
    url = "/tools/"
    weight = 60
  [[menus.main]]
    name = "教程"
    url = "/tutorials/"
    weight = 70

[markup.goldmark.renderer]
  unsafe = false
