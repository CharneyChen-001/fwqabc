baseURL = "https://fwqabc.com/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
title = "fwqabc 出海ABC"
theme = "PaperMod"
enableRobotsTXT = true
pagination.pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"
  merchant = "merchants"
  route = "routes"
  datacenter = "datacenters"

[languages]
  [languages.zh-cn]
    label = "中文"
    locale = "zh-CN"
    weight = 1
    contentDir = "content"
    [languages.zh-cn.params]
      homeTitle = "出海服务器，少踩坑少花钱"
      description = "出海ABC旗下服务器指南：国外VPS真实价格、线路科普与优惠汇总，帮站长、外贸和出海新手少踩坑少花钱。价格以官网为准。"
      DateFormat = "2006年1月2日"
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
    contentDir = "content.en"
    [languages.en.params]
      homeTitle = "Server deals and buying guides"
      description = "Chuhai ABC notes on VPS prices, lines, and offers that this site has already checked. Checkout prices win. Unverified fields stay empty."
      DateFormat = "January 2, 2006"

[permalinks]
  [permalinks.page]
    deals = "/deals/:contentbasename/"
    review = "/review/:contentbasename/"
    guides = "/guides/:contentbasename/"
    tutorials = "/tutorials/:contentbasename/"
    tools = "/tools/:contentbasename/"
    free = "/free/:contentbasename/"

[params]
  env = "production"
  homeTitle = "出海服务器，少踩坑少花钱"
  description = "出海ABC旗下服务器指南：国外VPS真实价格、线路科普与优惠汇总，帮站长、外贸和出海新手少踩坑少花钱。价格以官网为准。"
  tagline = "真实价格、线路科普、优惠汇总，选对一台不纠结"
  images = ["/brand/og-default-1200x630.jpg"]
  keywords = ["国外VPS", "VPS优惠", "外贸建站服务器", "出海服务器", "CN2 GIA", "双11 VPS"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowToc = true
  TocOpen = true
  ShowPostNavLinks = true
  xHandle = ""       # X 账号（如 chuhaiabc，不带 @）；留空则不显示
  telegram = ""      # Telegram 频道链接，如 https://t.me/fwqabc；留空则不显示订阅框
  umami = ""          # Umami 统计脚本地址，如 https://analytics.example.com/script.js；留空=不启用
  umamiWebsiteId = ""
  double11 = "2026-11-11T00:00:00+08:00"
  blackFridayStart = "2026-11-25T00:00:00+08:00"
  blackFridayEnd = "2026-11-30T23:59:59+08:00"

  DateFormat = "2006年1月2日"
  contactEmail = "chuhaiABC@outlook.com"
  lastUpdated = ""    # 可选：首页“最近更新”日期覆盖；留空则取全站最新文章的 lastmod

  [params.label]
    text = "出海ABC"
    icon = "/brand/logo-64.png"
    iconHeight = 32
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-32x32.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/android-chrome-512x512.png"
    theme_color = "#2f394c"
  [params.footer]
    text = "出海ABC —— 出海服务器，少踩坑少花钱。本站含推广链接，通过链接购买我们可能获得佣金，不影响你的价格，详见 [推广披露](/disclosure/)。价格以官网为准。"

[outputs]
  home = ["HTML", "RSS", "JSON", "feed", "postsmap", "serversmap", "knowledgemap", "pagesmap", "ensitemap"]

[outputFormats]
  [outputFormats.feed]
    mediaType = "application/rss+xml"
    baseName = "feed"
    isPlainText = false
    notAlternative = true
  [outputFormats.postsmap]
    mediaType = "application/xml"
    baseName = "sitemap-posts"
    isPlainText = false
    notAlternative = true
  [outputFormats.serversmap]
    mediaType = "application/xml"
    baseName = "sitemap-servers"
    isPlainText = false
    notAlternative = true
  [outputFormats.knowledgemap]
    mediaType = "application/xml"
    baseName = "sitemap-knowledge"
    isPlainText = false
    notAlternative = true
  [outputFormats.pagesmap]
    mediaType = "application/xml"
    baseName = "sitemap-pages"
    isPlainText = false
    notAlternative = true
  [outputFormats.ensitemap]
    mediaType = "application/xml"
    baseName = "sitemap-en"
    isPlainText = false
    notAlternative = true

