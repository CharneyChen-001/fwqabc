{{- with site.Params.umami }}{{ if site.Params.umamiWebsiteId }}
<script defer src="{{ . }}" data-website-id="{{ site.Params.umamiWebsiteId }}"></script>
{{- end }}{{ end }}
<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
{{- with .Params.faq }}
<script type="application/ld+json">{{ $m := slice }}{{ range . }}{{ $m = $m | append (dict "@type" "Question" "name" .q "acceptedAnswer" (dict "@type" "Answer" "text" (.a | plainify))) }}{{ end }}{{ dict "@context" "https://schema.org" "@type" "FAQPage" "mainEntity" $m | jsonify | safeJS }}</script>
{{- end }}
