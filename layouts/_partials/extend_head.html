<style>
/* ===== 设计系统 v2：色板 ===== */
:root{--c-brand:#F24615;--c-btn:#C2380F;--c-btn-h:#9E2D0B;
 --c-blue:#2563EB;--c-teal:#0D9488;--c-purple:#7C3AED;--c-red:#E8400F;--c-green:#16A34A;--c-slate:#475569;--c-gold:#B7791F;
 --tint:.08;--card-sh:0 2px 10px rgba(15,23,42,.06);--card-sh-h:0 12px 28px rgba(15,23,42,.12);--r:14px}
.dark{--c-blue:#60A5FA;--c-teal:#2DD4BF;--c-purple:#A78BFA;--c-red:#FF8A65;--c-green:#4ADE80;--c-slate:#94A3B8;--c-gold:#F6C453;--card-sh:0 2px 10px rgba(0,0,0,.3);--card-sh-h:0 12px 28px rgba(0,0,0,.45)}

.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--theme) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}

#menu a span.active,#menu a .active{border:0;color:var(--c-btn);font-weight:700}
#menu a span.active{background:rgba(242,70,21,.12);padding:.3em .8em;border-radius:99px}.dark #menu a .active{color:#FF8A65}
/* section bands */
.band{padding:1.3em 1.2em;border-radius:18px;margin:1.6em 0}
.band-deals{background:linear-gradient(180deg,rgba(242,70,21,.07),rgba(242,70,21,.015))}
.band-picks{background:linear-gradient(180deg,rgba(37,99,235,.07),rgba(124,58,237,.03))}
.band-latest{background:rgba(13,148,136,.06)}
.band-free{background:rgba(22,163,74,.06)}
.home-sec h2{align-items:center;gap:.5em;justify-content:flex-start}.home-sec h2 a{margin-left:auto}
.sec-ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:18px;color:#fff;background:var(--c-brand);flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.ico-red{background:linear-gradient(135deg,#F24615,#C2380F)}.ico-blue{background:linear-gradient(135deg,#0D9488,#2563EB)}.ico-green{background:linear-gradient(135deg,#22C55E,#0D9488)}
.sec-head{display:flex;gap:.7em;align-items:center;margin-bottom:1em}.sec-head .sec-ico{width:42px;height:42px;font-size:22px;background:linear-gradient(135deg,#2563EB,#7C3AED)}

.short-list li a{border-radius:10px;transition:background .15s}.short-list li a:hover{background:var(--entry)}

.pk-list{display:flex;flex-direction:column;gap:.7em}
.pk{--ac:var(--c-slate);display:grid;grid-template-columns:1.1fr 1.6fr 1.2fr 1.1fr auto;gap:1em;align-items:center;padding:.9em 1.1em;background:var(--theme);border-radius:var(--r);border:1px solid var(--border);border-left:5px solid var(--ac);box-shadow:var(--card-sh);transition:transform .15s,box-shadow .15s}
.pk:hover{transform:translateY(-2px);box-shadow:var(--card-sh-h)}
.pk-blue{--ac:var(--c-blue)}.pk-teal{--ac:var(--c-teal)}.pk-purple{--ac:var(--c-purple)}.pk-red{--ac:var(--c-red)}.pk-green{--ac:var(--c-green)}.pk-slate{--ac:var(--c-slate)}

.pk-use{display:flex;flex-direction:column;gap:.35em;align-items:flex-start}
