{{- $sec := dict "deals" "优惠促销" "free" "免费服务器" "cases" "实测案例" "routes" "线路专题" }}
<article class="article-card">
  <a href="{{ .RelPermalink }}">
    {{- with .Params.cover_img }}
    <img src="{{ . }}" alt="{{ $.Params.cover_alt | default $.Title }}" width="640" height="400" loading="lazy" decoding="async">
    {{- end }}
    <div class="article-body">
      <p class="article-kicker">{{ index $sec .Section | default .Section }} · {{ .Date.Format "2006年1月2日" }}</p>
      <h3>{{ .Title }}</h3>
      <p>{{ .Description | default .Summary | plainify | truncate 110 }}</p>
    </div>
  </a>
</article>
